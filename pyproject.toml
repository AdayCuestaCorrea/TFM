[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-madrid-demand"
version = "0.6.0"
description = "Madrid public transport demand forecasting — MSc thesis pipeline"
requires-python = ">=3.13"
# Runtime dependencies are pinned in requirements.txt, which stays the single source of
# truth for the reproducible environment. This file exists so `pip install -e .` makes the
# `src` package importable from anywhere -- notably from notebooks/, which otherwise cannot
# resolve `from src.evaluation import ...` without sys.path hacking.

[tool.setuptools.packages.find]
include = ["src*"]
